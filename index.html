<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futebol - Jogo Simples</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚽ JOGO DE FUTEBOL ⚽</h1>
        <div class="placar">
            <span>Jogador: <strong id="player-score">0</strong></span>
            <span>Goleiro: <strong id="cpu-score">0</strong></span>
        </div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div class="controls">
            <p><strong>Controles:</strong> ↑ ↓ ← → para mover • ESPAÇO para chutar</p>
            <button onclick="resetGame()">Reiniciar Jogo</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
